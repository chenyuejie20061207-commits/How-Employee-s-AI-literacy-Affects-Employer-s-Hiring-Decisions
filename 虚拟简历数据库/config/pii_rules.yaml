rules:
  - name: 身份证号
    pattern: '(?<![0-9Xx])[1-9][0-9]{5}(?:18|19|20)[0-9]{2}(?:0[1-9]|1[0-2])(?:0[1-9]|[12][0-9]|3[01])[0-9]{3}[0-9Xx](?![0-9Xx])'
    replacement: '[身份证号]'
  - name: 手机号
    pattern: '(?<![0-9])1[3-9][0-9]{9}(?![0-9])'
    replacement: '[手机号]'
  - name: 邮箱
    pattern: '(?<![A-Za-z0-9._%+-])[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}(?![A-Za-z0-9.-])'
    replacement: '[邮箱]'
  - name: 固定电话
    pattern: '(?<![0-9])(?:0[0-9]{2,3}[-— ]?)?[2-9][0-9]{6,7}(?![0-9])'
    replacement: '[固定电话]'
  - name: QQ号
    pattern: '(?i)(?:QQ|企鹅)\s*[:：]\s*[1-9][0-9]{4,11}'
    replacement: '[QQ号]'
  - name: 微信号
    pattern: '(?i)(?:微信|WeChat)\s*[:：]\s*[A-Za-z][A-Za-z0-9_-]{5,19}'
    replacement: '[微信号]'
  - name: 联系人姓名
    pattern: '(?:联系人|联系人姓名|姓名)\s*[:：]\s*[一-龥·]{2,4}'
    replacement: '[联系人姓名]'
